services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahjong_trainer
      POSTGRES_USER: mahjong
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mahjong_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong -d mahjong_trainer"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    # -js enables JetStream (the durable action log); -sd sets its storage dir;
    # -m exposes the monitoring endpoint used by the healthcheck below.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    # --accept-data-loss: this deploy drops the Account/Session/VerificationToken
    # tables (Auth.js-specific, retired in favor of Cloudflare Access identity —
    # see lib/server/cfAccess.ts). User-confirmed safe: nothing reads those
    # tables anymore.
    command: node node_modules/.bin/prisma db push --accept-data-loss
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mahjong:${DB_PASSWORD:-mahjong_dev}@postgres:5432/mahjong_trainer
    restart: on-failure

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Ordering only, not health-gated — NATS is optional durability (see
      # lib/server/eventLog.ts). The app must still start fine if it's down.
      nats:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://mahjong:${DB_PASSWORD:-mahjong_dev}@postgres:5432/mahjong_trainer
      # Identity — Cloudflare Access verifies sign-in at the tunnel; the app
      # only verifies the resulting JWT. See lib/server/cfAccess.ts.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      NATS_URL: nats://nats:4222
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  nats_data:
