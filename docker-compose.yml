services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahjong_trainer
      POSTGRES_USER: mahjong
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mahjong_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong -d mahjong_trainer"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: node node_modules/.bin/prisma db push
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mahjong:${DB_PASSWORD:-mahjong_dev}@postgres:5432/mahjong_trainer
    restart: on-failure

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://mahjong:${DB_PASSWORD:-mahjong_dev}@postgres:5432/mahjong_trainer
    ports:
      - "3000:3000"

volumes:
  postgres_data:
