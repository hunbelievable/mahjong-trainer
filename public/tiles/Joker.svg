<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <rect x="0" y="0" width="300" height="400" fill="#ffffff"/>

  <!-- Halo / aureole -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#b8860b" stroke-width="3"/>

  <!-- Buddha silhouette, seated in meditation -->
  <g fill="#7a4a08" stroke="#3a2208" stroke-width="2" stroke-linejoin="round">
    <!-- Body / robes -->
    <path d="M 70 290 Q 70 225 110 205 Q 150 192 190 205 Q 230 225 230 290 Z"/>
    <!-- Shoulders / arms wrapping forward -->
    <path d="M 88 240 Q 105 265 150 270 Q 195 265 212 240 Q 205 222 182 226 Q 150 245 118 226 Q 95 222 88 240 Z"/>
    <!-- Hands in lap (dhyana mudra) -->
    <ellipse cx="150" cy="267" rx="24" ry="9" fill="#a66b18" stroke="#3a2208" stroke-width="1.8"/>
    <!-- Neck -->
    <rect x="138" y="165" width="24" height="22"/>
    <!-- Head -->
    <ellipse cx="150" cy="148" rx="34" ry="40"/>
    <!-- Ushnisha (topknot) -->
    <path d="M 128 110 Q 150 78 172 110 Q 170 120 150 122 Q 130 120 128 110 Z"/>
    <!-- Finial dot on topknot -->
    <circle cx="150" cy="80" r="4" fill="#3a2208" stroke="none"/>
    <!-- Ears (long, hanging) -->
    <path d="M 116 145 Q 108 158 114 178 Q 122 170 122 158 Z"/>
    <path d="M 184 145 Q 192 158 186 178 Q 178 170 178 158 Z"/>
  </g>

  <!-- Face: closed eyes + serene mouth -->
  <g stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 131 148 Q 138 152 145 148"/>
    <path d="M 155 148 Q 162 152 169 148"/>
    <path d="M 141 168 Q 150 172 159 168"/>
  </g>

  <!-- Forehead urna -->
  <circle cx="150" cy="132" r="2.8" fill="#b93c3c"/>

  <text x="150" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="3">JOKER</text>
</svg>
